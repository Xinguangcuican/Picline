name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v5

      - name: 环境信息
        run: |
          sw_vers
          swift --version
          xcodebuild -version
          gh --version | head -1

      - name: 解析版本号
        id: meta
        run: |
          set -eu
          if [ "${GITHUB_REF#refs/tags/v}" != "$GITHUB_REF" ]; then
            TAG="${GITHUB_REF#refs/tags/}"
            VERSION="${TAG#v}"
          else
            TAG=""
            VERSION="$(sed -n 's/^## \([0-9][0-9.]*\).*/\1/p' CHANGELOG.md | head -1)"
          fi
          {
            echo "tag=$TAG"
            echo "version=$VERSION"
            echo "build=${GITHUB_RUN_NUMBER}"
          } >> "$GITHUB_OUTPUT"
          echo "版本 $VERSION · 内部号 ${GITHUB_RUN_NUMBER} · tag ${TAG:-(手动触发)}"

      - name: 编译通用二进制
        env:
          PICLINE_VERSION: ${{ steps.meta.outputs.version }}
          PICLINE_BUILD: ${{ steps.meta.outputs.build }}
          PICLINE_SIMPLE: '1'
        run: |
          scripts/build-picline.sh release
          echo "--- 架构 ---"
          lipo -archs build/Picline.app/Contents/MacOS/Picline
          echo "--- 版本 ---"
          /usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' build/Picline.app/Contents/Info.plist
          /usr/libexec/PlistBuddy -c 'Print CFBundleVersion' build/Picline.app/Contents/Info.plist
          echo "--- 签名 ---"
          codesign --verify --strict build/Picline.app && echo "签名完好"

      - name: 打包 dmg 与 zip
        run: |
          set -eu
          PICLINE_SKIP_BUILD=1 scripts/package-dmg.sh
          V="${{ steps.meta.outputs.version }}"
          mv build/Picline.zip "build/Picline-$V.zip"
          ls -lh build/*.dmg build/*.zip
          echo "--- 镜像内容 ---"
          hdiutil attach -readonly -noverify -noautoopen "build/Picline-$V.dmg" | tail -1
          ls -1 "/Volumes/Picline $V"
          lipo -archs "/Volumes/Picline $V/Picline.app/Contents/MacOS/Picline"
          hdiutil detach -quiet "/Volumes/Picline $V"

      - name: 上传构建产物
        uses: actions/upload-artifact@v5
        with:
          name: Picline-${{ steps.meta.outputs.version }}
          path: |
            build/*.dmg
            build/*.zip
          if-no-files-found: error
          retention-days: 14

      - name: 生成发布说明
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -eu
          V="${{ steps.meta.outputs.version }}"
          awk -v v="$V" '
            index($0, "## ") == 1 {
              if (p) exit
              if ($2 == v) { p = 1 }
              next
            }
            p { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          cat .github/release-footer.md >> "$RUNNER_TEMP/notes.md"
          echo "--- 说明预览 ---"
          head -12 "$RUNNER_TEMP/notes.md"
          echo "（共 $(wc -l < "$RUNNER_TEMP/notes.md") 行）"

      - name: 发布 Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          TAG="${{ steps.meta.outputs.tag }}"
          V="${{ steps.meta.outputs.version }}"
          ASSETS="build/Picline-$V.dmg build/Picline-$V.zip"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "该版本已存在，改为覆盖附件"
            gh release upload "$TAG" $ASSETS --clobber
          else
            gh release create "$TAG" $ASSETS \
              --title "Picline $V" \
              --notes-file "$RUNNER_TEMP/notes.md"
          fi
          gh release view "$TAG" --json tagName,url,assets
